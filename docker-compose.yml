version: "3.8"

services:
  app:
    container_name: sirita_opac
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /Users/macos/Documents/aldi/coding/slims/slims9_bulian:/slims9_bulian
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=slimsdb
      - DB_USERNAME=sirita
      - DB_PASSWORD=sirita_pass
    depends_on:
      - db
    networks:
      - sirita_net

  db:
    image: mariadb:lts
    container_name: sirita_db_opac
    ports:
      - "3308:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root_pass
      - MARIADB_DATABASE=slimsdb
      - MARIADB_USER=sirita
      - MARIADB_PASSWORD=sirita_pass
    volumes:
      - db_data:/var/lib/mysql
      - /Users/macos/Documents/aldi/coding/slims/slimsdb_backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sirita_net

networks:
  sirita_net:
    driver: bridge

volumes:
  db_data:
