version: "3.8"

services:
  app:
    container_name: sirita_slims
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sirita_slims
      - DB_USERNAME=sirita
      - DB_PASSWORD=sirita_pass
    depends_on:
      - db
    networks:
      - sirita_net

  db:
    image: mariadb:lts
    container_name: sirita_db
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root_pass
      - MARIADB_DATABASE=sirita_slims
      - MARIADB_USER=sirita
      - MARIADB_PASSWORD=sirita_pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sirita_net

networks:
  sirita_net:
    driver: bridge

volumes:
  db_data:
